stages:
  - validate
  - test
  - deploy

# -----------------------------
# 1. Validate repo structure
# -----------------------------
validate_dags:
  stage: validate
  tags:
    - airflow
    - dev
    - safe
  script:
    - echo "Validating DAG repository structure"
    - ls -la dags || true
    - echo "Validation completed"

# --------------------------------
# 2. Syntax check (MR only, advisory)
# --------------------------------
syntax_check:
  stage: test
  tags:
    - airflow
    - dev
    - safe
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - echo "Running Python syntax check (advisory)"
    - python3 -m compileall dags || true
  allow_failure: true

# --------------------------------
# 3. flake8 lint (MR only, advisory)
# --------------------------------
flake8_check:
  stage: test
  tags:
    - airflow
    - dev
    - safe
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - echo "Running flake8 linting (advisory)"
    - flake8 dags --max-line-length=120 --statistics
  allow_failure: true

# --------------------------------
# 4. AUTO deploy to Airflow DEV
# --------------------------------
deploy_dags_dev:
  stage: deploy
  tags:
    - airflow
    - dev
    - safe
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  script:
    - echo "Auto-deploying DAGs to Airflow DEV"
    - rsync -av --checksum dags/ /home/prochurn/AirFlow/airflow/dags/
    - echo "Deploy completed (safe, no delete)"
