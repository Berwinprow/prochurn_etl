stages:
  - validate
  - test

validate_dags:
  stage: validate
  tags:
    - airflow
    - dev
    - safe
  script:
    - echo "Validating DAG repository structure"
    - ls -la dags || true
    - echo "Validation completed"

syntax_check:
  stage: test
  tags:
    - airflow
    - dev
    - safe
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - echo "Running Python syntax check (advisory)"
    - python3 -m compileall dags || true
  allow_failure: true

flake8_check:
  stage: test
  tags:
    - airflow
    - dev
    - safe
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - echo "Running flake8 linting (advisory)"
    - flake8 dags --max-line-length=120 --statistics || true
  allow_failure: true
